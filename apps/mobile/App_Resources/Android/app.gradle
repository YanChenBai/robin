android {
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        ndk {
            // NativeScript 默认已加入所有架构，必须清空后再限制。
            abiFilters.clear()
            abiFilters 'arm64-v8a'
        }
    }
    def robinNative = new File(rootProject.projectDir, '../../../../packages/nativescript-robin/native/android')
    sourceSets {
        main {
            java.srcDirs += new File(robinNative, 'src/main/java')
            jniLibs.srcDirs += new File(robinNative, 'src/main/jniLibs')
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}
